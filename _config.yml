baseurl: '/'
permalink: pretty
title: 'Todd Cullen'

logo:
  mobile: "images/logo/logo.png"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/logo.png"
  desktop_height: "64px"
  desktop_width: "64px"

collections:
  team:
    output: true
  posts:
    output: true
    permalink: /blog/:title
    sort_by: date
    reverse: true
  campaigns:
    output: true
    permalink: /campaigns/:title

defaults:
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"
  - scope:
      path: ""
      type: "campaigns"
    values:
      layout: "campaign"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md

markdown: kramdown
highlighter: rouge
kramdown:
    input: GFM 
    syntax_highlighter: rouge
